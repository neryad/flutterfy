name: flutterfy
description: A powerful command-line tool for Flutter and Dart projects to automatically manage semantic version updates in pubspec.yaml files. Supports patch, minor, and major version increments with intelligent build number handling.
version: 1.1.1+1727741864
repository: https://github.com/neryad/flutterfy
homepage: https://github.com/neryad/flutterfy
issue_tracker: https://github.com/neryad/flutterfy/issues
documentation: https://github.com/neryad/flutterfy#readme

# Funding information (opcional)
funding:
  - https://ko-fi.com/neryad

# Temas/categorías para pub.dev
topics:
  - versioning
  - flutter
  - dart
  - automation
  - devtools
  - cli
  - pubspec

# SDK constraints más específicos
environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencias principales
dependencies:
  path: ^1.8.3 # Para manejo de rutas de archivos

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# Especificar plataformas soportadas con más detalle
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

# Configuración de executable
executables:
  flutterfy: flutterfy
